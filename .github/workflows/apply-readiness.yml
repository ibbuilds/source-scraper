name: Apply authorized readiness patch
on:
  push:
    branches: [codex/integration-readiness-20261109]
    paths: [.github/readiness.patch, .github/workflows/apply-readiness.yml]
permissions:
  contents: write
concurrency:
  group: apply-readiness-patch
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository_owner == 'ibbuilds'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply only the reviewed source patch
        id: patch
        run: |
          if git apply --reverse --check .github/readiness.patch 2>/dev/null; then
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          else
            git apply --check .github/readiness.patch
            git apply .github/readiness.patch
            git diff --check
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.patch.outputs.applied == 'true'
        with:
          node-version: '22.16.0'
      - if: steps.patch.outputs.applied == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.patch.outputs.applied == 'true'
        run: npm run check && npm test
      - name: Commit verified changes to the existing work branch only
        if: steps.patch.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- . ':!.github/readiness.patch' ':!.github/workflows/apply-readiness.yml'
          git commit -m 'fix: version integration-ready engine and preserve immutable releases'
          git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/codex/integration-readiness-20261109
